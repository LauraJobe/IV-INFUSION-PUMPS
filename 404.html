<script>
  // GitHub Pages addresses are case-sensitive. Send /Modular, /MODULAR, etc. to
  // the real folder; anything else unknown goes to the main site.
  (function () {
    var m = location.pathname.match(/^(.*?\/)modular\/?(.*)$/i);
    if (m) location.replace(m[1] + "modular/" + m[2] + location.search + location.hash);
    else location.replace(location.pathname.split("/").slice(0, 2).join("/") + "/");
  })();
</script>
